<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu Cầu Đặt Phòng | Hotel</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
</head>
<body>
<style>
    .yeu-cau-header {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
    }
    .yeu-cau-header h1 { margin: 0; }
    .yeu-cau-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        height: 36px;
        padding: 0 12px;
        background: linear-gradient(135deg, #ff5252, #d32f2f);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        border-radius: 18px;
        box-shadow: 0 2px 6px rgba(211, 47, 47, 0.35);
        animation: yeuCauPulse 2s ease-in-out infinite;
    }
    .yeu-cau-badge.zero {
        background: #888;
        animation: none;
        box-shadow: none;
    }
    @keyframes yeuCauPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    .wait-time {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: #0C447C;
        white-space: nowrap;
    }
    .wait-time.long {
        color: #d32f2f;
    }
    .wait-time.urgent {
        color: #d32f2f;
        animation: urgentBlink 1s ease-in-out infinite;
    }
    @keyframes urgentBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    .suc-chua-ok {
        color: #2F9E4D;
        font-weight: 600;
    }
    .suc-chua-canh-bao {
        color: #d32f2f;
        font-weight: 700;
        background: #FFF3E0;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid #FFB74D;
    }

    .status-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid transparent;
        white-space: nowrap;
    }
    .status-badge.warning {
        background: #FAEEDA;
        color: #633806;
        border-color: #BA7517;
    }
    .status-badge.info {
        background: #E6F1FB;
        color: #0C447C;
        border-color: #378ADD;
    }

    /* Toast notification */
    .toast-container {
        position: fixed;
        top: 90px;
        right: 24px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .toast {
        background: #fff;
        border-left: 4px solid #0C447C;
        padding: 14px 20px;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        min-width: 280px;
        max-width: 360px;
        font-size: 14px;
        animation: toastSlideIn 0.35s ease-out;
    }
    .toast.success { border-left-color: #2F9E4D; }
    .toast.error { border-left-color: #d32f2f; }
    .toast-title { font-weight: 700; margin-bottom: 4px; color: #0C447C; }
    @keyframes toastSlideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>

<div th:replace="~{fragments/cms-sidebar :: cmsSidebar}"></div>
<div th:replace="~{fragments/headers/cms-header :: cmsHeader}"></div>

<div class="toast-container" id="toastContainer"></div>

<main class="admin-wrapper">
    <div class="admin-header yeu-cau-header">
        <h1>Yêu Cầu Đặt Phòng Chờ Xử Lý</h1>
        <span class="yeu-cau-badge" th:classappend="${totalCount == 0} ? ' zero' : ''"
              id="yeuCauBadgeTop"
              th:text="${totalCount}">0</span>
        <a th:href="@{/nhan-su/yeu-cau-dat-phong}" class="admin-btn outline">Làm mới</a>
    </div>

    <div th:if="${success}" class="admin-message success">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="admin-message error">
        <span th:text="${error}"></span>
    </div>

    <section class="admin-panel">
        <h2>
            Danh Sách Yêu Cầu
            <span style="font-weight: 400; font-size: 14px; color: #666; margin-left: 12px;">
                (Tự động cập nhật mỗi 5 giây)
            </span>
        </h2>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Phòng</th>
                    <th>Ngày nhận</th>
                    <th>Ngày trả</th>
                    <th>Sức chứa</th>
                    <th>CCCD</th>
                    <th>Mã tra cứu</th>
                    <th>Thời gian chờ</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody id="yeuCauTbody">
                <tr th:each="item : ${yeuCauList}" th:attr="data-ngay-tao=${item.datPhong.ngayTao}">
                    <td>
                        <strong th:text="${item.datPhong.id}"></strong>
                    </td>
                    <td>
                        <strong th:text="${item.datPhong.n != null ? item.datPhong.n.hoTen :
                              (item.datPhong.hoten != null ? item.datPhong.hoten + ' (Vãng lai)' : 'Không có')}">
                        </strong>
                        <div style="font-size: 12px; color: #666;"
                             th:text="${item.datPhong.n != null ? item.datPhong.n.email :
                                   (item.datPhong.email != null ? item.datPhong.email : '')}">
                        </div>
                    </td>
                    <td>
                        <span th:each="ct : ${item.chiTiet}"
                              th:text="${ct.p != null ? ct.p.soPhong + ' ' : ''}"></span>
                    </td>
                    <td th:text="${item.datPhong.ngaydatPhong != null ?
                          #temporals.format(item.datPhong.ngaydatPhong, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${item.datPhong.ngaytraPhong != null ?
                          #temporals.format(item.datPhong.ngaytraPhong, 'dd/MM/yyyy') : ''}"></td>
                    <td>
                        <span th:text="${item.datPhong.songuoiLon + ' NL, ' + item.datPhong.sotreEm + ' TE'}"></span>
                    </td>
                    <td>
                        <span th:if="${item.datPhong.ma_cccd == null or item.datPhong.ma_cccd.isEmpty()}"
                              class="status-badge warning">⚠ Thiếu CCCD</span>
                        <span th:if="${item.datPhong.ma_cccd != null and !item.datPhong.ma_cccd.isEmpty()}"
                              th:text="${item.datPhong.ma_cccd}"></span>
                    </td>
                    <td>
                        <code th:if="${item.datPhong.maTraCuu != null}" th:text="${item.datPhong.maTraCuu}"></code>
                        <span th:if="${item.datPhong.maTraCuu == null}" style="color: #999;">—</span>
                    </td>
                    <td>
                        <span class="wait-time"
                              th:attr="data-created=${item.datPhong.ngayTao}">—</span>
                    </td>
                    <td>
                        <a th:href="@{/nhan-su/yeu-cau-dat-phong/chi-tiet/{id}(id=${item.datPhong.id})}"
                           class="admin-btn small primary">
                            Xem chi tiết
                        </a>
                    </td>
                </tr>
                <tr th:if="${yeuCauList.isEmpty()}" id="emptyState">
                    <td colspan="10">
                        <div class="empty-state">
                            Hiện không có yêu cầu đặt phòng nào đang chờ xử lý.
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Hotel. All rights reserved.</p>
</footer>

<script>
    (function () {
        var COUNT_URL = '[[ @{/nhan-su/api/yeu-cau/dat-phong/count} ]]';
        var CURRENT_COUNT = parseInt(document.getElementById('yeuCauBadgeTop').textContent || '0', 10);

        function formatWaitTime(seconds) {
            if (seconds < 60) return seconds + ' giây';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' phút ' + (seconds % 60) + ' giây';
            var h = Math.floor(seconds / 3600);
            var m = Math.floor((seconds % 3600) / 60);
            return h + ' giờ ' + m + ' phút';
        }

        function updateWaitTimes() {
            var cells = document.querySelectorAll('.wait-time[data-created]');
            var now = Date.now();
            cells.forEach(function (cell) {
                var created = cell.getAttribute('data-created');
                if (!created) return;
                var createdMs = new Date(created).getTime();
                if (isNaN(createdMs)) return;
                var seconds = Math.floor((now - createdMs) / 1000);
                cell.textContent = formatWaitTime(seconds);
                cell.classList.remove('long', 'urgent');
                if (seconds >= 1800) cell.classList.add('urgent');
                else if (seconds >= 300) cell.classList.add('long');
            });
        }

        function showToast(type, title, msg) {
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = '<div class="toast-title"></div><div class="toast-msg"></div>';
            toast.querySelector('.toast-title').textContent = title;
            toast.querySelector('.toast-msg').textContent = msg;
            container.appendChild(toast);
            setTimeout(function () {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(function () { toast.remove(); }, 500);
            }, 5000);
        }

        function refreshPage() {
            window.location.reload();
        }

        function pollCount() {
            fetch(COUNT_URL, { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data || typeof data.count !== 'number') return;
                    var newCount = data.count;
                    var badge = document.getElementById('yeuCauBadgeTop');
                    if (badge) {
                        badge.textContent = newCount;
                        badge.classList.toggle('zero', newCount === 0);
                    }
                    if (newCount > CURRENT_COUNT) {
                        var diff = newCount - CURRENT_COUNT;
                        showToast('success',
                            diff === 1 ? 'Có yêu cầu mới!' : ('Có ' + diff + ' yêu cầu mới!'),
                            'Đang tải lại danh sách...');
                        setTimeout(refreshPage, 1500);
                    }
                    CURRENT_COUNT = newCount;
                })
                .catch(function (e) { /* silent */ });
        }

        // Cap nhat thoi gian cho moi 1 giay
        setInterval(updateWaitTimes, 1000);
        updateWaitTimes();

        // Polling so luong yeu cau moi 5 giay
        setInterval(pollCount, 5000);
    })();
</script>
</body>
</html>
