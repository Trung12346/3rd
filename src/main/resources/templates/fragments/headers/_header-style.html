<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="headerStyle">

    <style>

        .hb-header-shell {

            --hb-blue: #3498DB;

            --hb-blue-dark: #2980B9;

            --hb-text: #2f3438;

            --hb-muted: #667085;

            --hb-border: #d9e2ec;

            --hb-white: #ffffff;



            background: var(--hb-white);

            border-top: 2px solid var(--hb-blue-dark);

            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);

            color: var(--hb-text);

            font-family: 'Montserrat', Arial, sans-serif;

            position: sticky;

            top: 0;

            z-index: 1000;

        }



        .hb-header {

            align-items: center;

            display: grid;

            gap: 22px;

            grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) minmax(220px, max-content);

            min-height: 64px;

            padding: 10px 5.5%;

        }



        .hb-header-compact {

            gap: 16px;

            grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) minmax(185px, max-content);

            padding-left: 4%;

            padding-right: 4%;

        }



        .hb-logo {

            align-items: center;

            display: inline-flex;

            justify-self: start;

            text-decoration: none;

        }



        .hb-logo img {

            display: block;

            height: 38px;

            object-fit: contain;

            width: auto;

        }



        .hb-header-compact .hb-logo img {

            height: 34px;

        }



        .hb-nav {

            align-items: center;

            display: flex;

            gap: 24px;

            justify-content: center;

            min-width: 0;

        }



        .hb-nav-dense {

            gap: 18px;

        }



        .hb-nav a {

            color: var(--hb-text);

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 0;

            line-height: 1;

            text-decoration: none;

            text-transform: uppercase;

            transition: color 0.2s ease;

            white-space: nowrap;

        }



        .hb-nav-dense a {

            font-size: 12px;

        }



        .hb-nav a:hover,

        .hb-nav a[aria-current="page"] {

            color: var(--hb-blue);

        }



        .hb-nav-item {

            align-items: center;

            display: inline-flex;

            position: relative;

        }



        .hb-nav-item::after {

            content: "";

            height: 14px;

            left: 0;

            position: absolute;

            right: 0;

            top: 100%;

        }



        .hb-nav-link {

            align-items: center;

            display: inline-flex;

            gap: 4px;

        }



        .hb-nav-caret {

            font-size: 10px;

            line-height: 1;

            margin-left: 2px;

        }



        .hb-dropdown-menu {

            background: #fff;

            border: 1px solid var(--hb-border);

            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);

            display: none;

            left: 0;

            min-width: 220px;

            padding: 8px 0;

            position: absolute;

            top: calc(100% + 14px);

            z-index: 1010;

        }



        .hb-nav-item:hover .hb-dropdown-menu,

        .hb-nav-item:focus-within .hb-dropdown-menu {

            display: block;

        }



        .hb-dropdown-menu a {

            color: var(--hb-text);

            display: block;

            font-size: 13px;

            font-weight: 500;

            line-height: 1.25;

            padding: 10px 16px;

            text-transform: none;

            white-space: nowrap;

        }



        .hb-dropdown-menu a:hover {

            background: #eef7fd;

            color: var(--hb-blue);

        }



        .hb-dropdown-divider {

            border-top: 1px solid var(--hb-border);

            margin: 7px 0;

        }



        .hb-actions,

        .hb-account {

            align-items: center;

            display: flex;

            gap: 12px;

            justify-content: flex-end;

            min-width: 0;

        }



        .hb-auth-button {

            align-items: center;

            border-radius: 0;

            display: inline-flex;

            font-size: 13px;

            font-weight: 600;

            justify-content: center;

            min-height: 36px;

            min-width: 104px;

            padding: 0 18px;

            text-decoration: none;

            text-transform: uppercase;

            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;

            white-space: nowrap;

        }



        .hb-auth-button.outline {

            background: #fff;

            border: 1px solid var(--hb-blue);

            color: var(--hb-blue);

        }



        .hb-auth-button.outline:hover {

            background: #eef7fd;

        }



        .hb-auth-button.filled {

            background: var(--hb-blue);

            border: 1px solid var(--hb-blue);

            color: #fff;

        }



        .hb-auth-button.filled:hover {

            background: var(--hb-blue-dark);

            border-color: var(--hb-blue-dark);

        }



        .hb-greeting {

            color: var(--hb-text);

            font-size: 13px;

            white-space: nowrap;

        }



        .hb-greeting strong,

        .hb-account-name {

            color: var(--hb-blue);

            font-weight: 700;

        }



        .hb-profile-link,

        .hb-logout-link {

            align-items: center;

            border: 1px solid var(--hb-border);

            color: var(--hb-text);

            display: inline-flex;

            font-size: 12px;

            font-weight: 600;

            justify-content: center;

            min-height: 32px;

            padding: 0 15px;

            text-decoration: none;

            text-transform: uppercase;

            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;

            white-space: nowrap;

        }



        .hb-profile-link {

            border-color: var(--hb-blue);

            color: var(--hb-blue);

        }



        .hb-profile-link:hover {

            background: #eef7fd;

        }



        .hb-logout-link:hover {

            background: #fff5f5;

            border-color: #e74c3c;

            color: #e74c3c;

        }



        .hb-avatar {

            align-items: center;

            background: #eaf6ff;

            border: 1px solid #cfe8fb;

            border-radius: 50%;

            color: var(--hb-blue-dark);

            display: inline-flex;

            flex: 0 0 34px;

            font-size: 12px;

            font-weight: 700;

            height: 34px;

            justify-content: center;

            text-transform: uppercase;

            width: 34px;

        }



        .hb-account-text {

            display: grid;

            gap: 2px;

            min-width: 0;

        }



        .hb-account-label {

            color: var(--hb-muted);

            font-size: 11px;

            line-height: 1;

        }



        .hb-account-name {

            display: block;

            font-size: 13px;

            line-height: 1.2;

            max-width: 190px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }



        @media (max-width: 1100px) {

            .hb-header,

            .hb-header-compact {

                grid-template-columns: 1fr;

                justify-items: center;

                padding: 14px 20px;

            }



            .hb-logo,

            .hb-actions,

            .hb-account {

                justify-self: center;

            }



            .hb-nav {

                flex-wrap: wrap;

                gap: 16px 24px;

            }



            .hb-dropdown-menu {

                left: 50%;

                transform: translateX(-50%);

            }

        }



        @media (max-width: 560px) {

            .hb-actions,

            .hb-account {

                flex-wrap: wrap;

                justify-content: center;

            }



            .hb-auth-button {

                min-width: 96px;

            }

        }



        /* ===== Chuông "đơn đang dở" cho khách vãng lai =====

           Đặt cạnh nút Đăng nhập/Đăng ký. Có badge đỏ khi có đơn dở.

           Bấm chuông hiện popup thông tin đơn + nút Tiếp tục đặt. */

        .hb-bell-wrap {

            position: relative;

            display: inline-flex;

            align-items: center;

        }

        .hb-bell-btn {

            position: relative;

            background: transparent;

            border: none;

            color: var(--hb-text);

            width: 40px;

            height: 40px;

            border-radius: 50%;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: background 0.2s ease, color 0.2s ease;

            font-size: 18px;

            padding: 0;

        }

        .hb-bell-btn:hover { background: #eef7fd; color: var(--hb-blue); }

        .hb-bell-btn .hb-bell-badge {

            position: absolute;

            top: 4px;

            right: 4px;

            min-width: 18px;

            height: 18px;

            padding: 0 5px;

            background: #e74c3c;

            color: #fff;

            border-radius: 999px;

            font-size: 10.5px;

            font-weight: 700;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border: 2px solid #fff;

            box-shadow: 0 0 0 1px rgba(231, 76, 60, 0.35);

            line-height: 1;

        }

        .hb-bell-popover {

            position: absolute;

            top: calc(100% + 12px);

            right: 0;

            min-width: 320px;

            max-width: 372px;

            background: #fff;

            border: 1px solid var(--hb-border);

            border-radius: 12px;

            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);

            padding: 16px 18px 18px;

            z-index: 1100;

            display: none;

            font-family: 'Inter', Arial, sans-serif;

            color: var(--hb-text);

        }

        .hb-bell-wrap.open .hb-bell-popover { display: block; }

        .hb-bell-popover::before {

            content: "";

            position: absolute;

            top: -7px;

            right: 14px;

            width: 12px;

            height: 12px;

            background: #fff;

            border-top: 1px solid var(--hb-border);

            border-left: 1px solid var(--hb-border);

            transform: rotate(45deg);

        }

        .hb-bell-popover-title {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 14px;

            font-weight: 700;

            color: #b9770e;

            text-transform: none;

            margin-bottom: 6px;

        }

        .hb-bell-popover-title.hb-bell-popover-success {

            color: #15803d;

        }

        .hb-bell-popover-title.hb-bell-popover-success i {

            font-size: 18px;

            color: #22c55e;

        }

        .hb-bell-popover-title i {

            font-size: 15px;

            width: 30px;

            height: 30px;

            flex: none;

            border-radius: 50%;

            background: #fff7e6;

            display: inline-flex;

            align-items: center;

            justify-content: center;

        }

        .hb-bell-popover-title.hb-bell-popover-success i { background: #ecfdf3; }

        .hb-bell-popover-step {

            font-size: 12.5px;

            color: var(--hb-muted);

            line-height: 1.5;

            margin-bottom: 12px;

        }

        .hb-bell-popover-step strong { color: var(--hb-text); }



        /* ===== Mini-stepper: cho thấy khách đang ở bước nào trong đơn dang dở ===== */

        .hb-bell-mini-stepper {

            display: flex;

            align-items: flex-start;

            gap: 0;

            margin-bottom: 12px;

            padding: 10px 8px;

            background: #f9fafb;

            border-radius: 9px;

            border: 1px solid var(--hb-border);

        }

        .hb-bell-mini-step {

            flex: 1;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 5px;

            text-align: center;

            font-size: 10.5px;

            font-weight: 600;

            color: #9ca3af;

            min-width: 0;

        }

        .hb-bell-mini-step span.hb-bell-mini-label {

            line-height: 1.2;

            padding: 0 2px;

        }

        .hb-bell-mini-dot {

            width: 20px;

            height: 20px;

            border-radius: 50%;

            background: #e5e7eb;

            color: #9ca3af;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 10px;

            font-weight: 800;

            flex: none;

        }

        .hb-bell-mini-step.active { color: #b9770e; }

        .hb-bell-mini-step.active .hb-bell-mini-dot { background: #f39c12; color: #fff; }

        .hb-bell-mini-step.done { color: #15803d; }

        .hb-bell-mini-step.done .hb-bell-mini-dot { background: #dcfce7; color: #15803d; }

        .hb-bell-mini-line {

            flex: 0 0 auto;

            width: 28px;

            height: 2px;

            background: var(--hb-border);

            margin-top: 9px;

        }



        .hb-bell-popover-meta {

            display: grid;

            gap: 7px;

            font-size: 12px;

            color: var(--hb-muted);

            line-height: 1.4;

            background: #f9fafb;

            border-radius: 9px;

            padding: 10px 12px;

            margin-bottom: 14px;

        }

        .hb-bell-popover-meta strong { color: var(--hb-text); font-weight: 700; }

        .hb-bell-meta-row {

            display: flex;

            align-items: center;

            gap: 8px;

        }

        .hb-bell-meta-row i {

            color: var(--hb-blue);

            font-size: 12px;

            width: 15px;

            flex: none;

            text-align: center;

        }

        .hb-bell-popover-actions {

            display: flex;

            gap: 8px;

        }

        .hb-bell-popover-actions a,

        .hb-bell-popover-actions button {

            flex: 1;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            padding: 10px 14px;

            border-radius: 9px;

            font-size: 12.5px;

            font-weight: 700;

            text-decoration: none;

            text-transform: none;

            font-family: inherit;

            cursor: pointer;

            transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;

        }

        .hb-bell-popover-actions .hb-bell-go {

            background: linear-gradient(120deg, #f5a623, #e8890c);

            color: #fff;

            border: none;

            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.32);

        }

        .hb-bell-popover-actions .hb-bell-go:hover { box-shadow: 0 6px 16px rgba(243, 156, 18, 0.42); }

        .hb-bell-popover-actions .hb-bell-dismiss {

            background: #fff;

            color: var(--hb-muted);

            border: 1.5px solid var(--hb-border);

        }

        .hb-bell-popover-actions .hb-bell-dismiss:hover { border-color: #c2c9d3; color: var(--hb-text); background: #f9fafb; }

    </style>

</th:block>

</body>

</html>
