<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên | Hotel</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:replace="~{fragments/headers/app-header :: appHeader}"></div>

<main class="auth-wrapper">
    <div class="auth-card register">
        <h2>Đăng Ký <span>Tài Khoản</span></h2>

        <p th:if="${registerError}" th:text="${registerError}"
           style="color:#c0392b; font-weight:600; margin-bottom:16px;"></p>
        <p th:if="${registerSuccess}" th:text="${registerSuccess}"
           style="color:#27ae60; font-weight:600; margin-bottom:16px;"></p>

        <form id="registerForm" th:action="@{/Register}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="ho_ten">Họ và Tên</label>
                    <input type="text" id="ho_ten" name="ho_ten" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="mat_khau_hash">Mật khẩu</label>
                    <input type="password" id="mat_khau_hash" name="mat_khau_hash" placeholder="Tối thiểu 7 ký tự" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="so_dien_thoai">Số điện thoại</label>
                    <input type="tel" id="so_dien_thoai" name="so_dien_thoai" placeholder="09xxxxxxxx" required pattern="[0-9]{10}">
                </div>

                <div class="form-group">
                    <label for="dia_chi">Địa chỉ liên hệ</label>
                    <input type="text" id="dia_chi" name="dia_chi" placeholder="Số nhà, đường, tỉnh/TP" required>
                </div>

                <div class="form-group">
                    <label for="ngay_sinh">Ngày sinh</label>
                    <input type="date" id="ngay_sinh" required>
                    <small id="ngaySinhError" style="color:#c0392b; display:none;">Bạn phải đủ 18 tuổi trở lên để đăng ký.</small>
                </div>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 30px;">Tạo Tài Khoản</button>
        </form>

        <div class="auth-footer">
            <p>Đã có tài khoản? <a href="/Login" th:href="@{/Login}">Đăng nhập ngay</a></p>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Hotel. All rights reserved.</p>
</footer>

<script>
    (function () {
        var form = document.getElementById('registerForm');
        var ngaySinhInput = document.getElementById('ngay_sinh');
        var errorEl = document.getElementById('ngaySinhError');

        function isAtLeast18(dateStr) {
            var birthDate = new Date(dateStr);
            if (isNaN(birthDate.getTime())) {
                return false;
            }
            var today = new Date();
            var age = today.getFullYear() - birthDate.getFullYear();
            var monthDiff = today.getMonth() - birthDate.getMonth();
            var dayDiff = today.getDate() - birthDate.getDate();
            if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
                age--;
            }
            return age >= 18;
        }

        // Cap the date picker so future dates can't be picked
        var todayStr = new Date().toISOString().split('T')[0];
        ngaySinhInput.setAttribute('max', todayStr);

        form.addEventListener('submit', function (e) {
            var value = ngaySinhInput.value;
            if (!value || !isAtLeast18(value)) {
                e.preventDefault();
                errorEl.style.display = 'block';
                ngaySinhInput.focus();
            } else {
                errorEl.style.display = 'none';
            }
        });

        ngaySinhInput.addEventListener('change', function () {
            if (ngaySinhInput.value && isAtLeast18(ngaySinhInput.value)) {
                errorEl.style.display = 'none';
            }
        });
    })();
</script>

</body>
</html>
